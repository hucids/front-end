<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap{
            width: 200px;
            height: 200px;
            background: purple;
        }
        .one{
            width: 100px;
            height: 100px;
            background: pink;
        }
    </style>
</head>
<body>
    <!-- 操作元素属性(CSS样式) -->
     <div class="wrap">曲奇111</div>

     <script>
        var divElm = document.querySelector(".wrap")

        // 操作元素属性  在行内样式中生效(优先级)
        // divElm.setAttribute("属性名", "属性值")
        // 更改class/id来更改样式
        setTimeout(() => {
            divElm.setAttribute("class", "one")
        }, 4000);
        // 直接更改样式
        divElm.setAttribute("style", "color:#fff; font-size:40px;");
        // 另一种方法 也在行内样式生效
        // 元素.style.属性 = "值"
        divElm.style.color = "orange";
        divElm.style.fontSize = "20px"; // 注意此处复合属性要使用小驼峰法

        // 查看元素属性
        // 语法: divElm.getAttribute("属性名")
        console.log(divElm.getAttribute("style"));  // 获取style属性值 只能获取行内样式 获取不到内部样式和外部样式
        console.log(divElm.getAttribute("class"));  // 获取类名
        
        // 删除元素属性
        // 语法: divElm.removeAttribute("属性名")
        divElm.removeAttribute("style")
     </script>
</body>
</html>
