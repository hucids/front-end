<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 事件函数也是异步代码 且可以多次执行 -->
     <!-- 补充
      获取输入框内容语法: 元素.value
     -->

    用户名:<input type="text">
    密码:<input type="text">
    <button>点击提交</button>

    <script>
        let a = document.querySelector("input") // 用户名 密码  数组
        let b = document.querySelector("button")

        b.onclick = () => {
            console.log(a[0].value, "用户名");
            console.log(a[1].value, "密码");
        };
    </script>
</body>
</html>
