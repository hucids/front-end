<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 50px;
            background-color: pink;
            color: #fff;
            text-align: center;
            line-height: 50px;
        }
    </style>
</head>
<body>
    <div class="box">点击</div>
    用户名<input type="text" class="one">

    <script>
        // 事件种类
        
        // 鼠标事件
        var divElm = document.querySelector(".box")
        // 1.左键单击 click  点击: 一次按下一次抬起
        // 2.左键双击 dblclick
        // 3.鼠标移入 mouseover/mouseenter
        // 4.鼠标移出 mouseout/mouseleave
        // 5.鼠标按下 mousedown
        // 6.鼠标抬起 mouseup
        // 7.鼠标移动 mousemove
        // 8.右键单击 contextmenu
        divElm.onclick = () => {
            console.log("左键单击");
        }

        // 表单事件
        var inputElm = document.querySelector(".one")
        // 1.获取焦点之后 focus
        // 2.失去焦点之后 blur
        // 3.改变内容之后(输入内容并回车或失去焦点) change
        // 4.选择后 onselect
        // 5.重置后 onreset
        // 6.提交后 onsubmit
        inputElm.onfocus = () => {
            console.log("获取焦点");
        }

        // 键盘事件 绑定页面标签
        // 键按下 keydown keypress
        // 键抬起 keyup
        document.documentElement.onkeydown = () => {
            console.log("键按下了");
        }
    </script>
</body>
</html>
