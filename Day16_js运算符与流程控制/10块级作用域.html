<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 块级作用域  由{}包裹的区域
     let和const在声明时会形成块级作用域 确保外部无法访问到
     -->
     <script>
        {
        var a = 10;
        let b = 100;
        }
        console.log(a); // 10
        console.log(b); // 报错
        
     </script>
    
</body>
</html>
