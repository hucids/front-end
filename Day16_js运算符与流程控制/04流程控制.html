<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 流程控制 -->
     <!-- 分支语句 if/switch -->
      <script>
        // if的单分支结构
        // 语法:if(条件){代码块}  条件成立时执行代码块
        var a = 4;
        if(a > 1){
            console.log("a>1");
        }
        // if的双分支结构
        // 语法:if(条件){条件成立时执行}else{条件不成立时执行}
        var b = 1;
        if (b < 1) {
            console.log("b<1");
            
        } else {
            console.log("b>=1");
            
        }

        // 三目运算符(三元运算符) 简化if双分支代码
        // 语法: 条件判断 ? true执行的语句 : false执行语句
        // 注:执行语句处只能执行一条语句
        b < 1 ? console.log("b<1") : console.log("b>=1");

        // if的多分支结构
        // 语法:if(条件1){条件1成立时执行}else if(条件2){条件2成立时执行}...else{前面条件都不成立时执行}
        if (b == 10) {
            console.log(10);
        }else if(b == 9){
            console.log(9);
        }else{
            console.log(0);
        }

        // switch语句 自带循环效果
        // switch (key) {
        //     case value:
                
        //         break;
        
        //     default:
        //         break;
        // }
        // key 需要判断的值
        // value 与key进行比较的值(全等比较 类型要一致)
        // default 所有case都匹配失败时执行 一般写在末尾
        var week = Number(prompt("请输入一个数字"));
        switch (week) {
            case 1:
                console.log("今天周一");
                break; // 每条语句写完都一定要写 否则会有贯穿现象
            case 2:
                console.log("今天周二");
            default:
                console.log("数据有误");
                break;
        }
      </script>
      <!-- 循环结构 while  do...while  for
     -->
      <script>
        // for循环
        // 结构:for(设置一个初始值;循环条件;初始变量进行改变){}
        for (var i = 0; i < 3; i++) {
            console.log(i);
        }
        // break语句:用于立即退出循环
        // continue语句:用于跳过本次循环 开始下一次循环
        for (var i = 0; i < 5; i++) {
            if (i == 3) {
                break
            }
            console.log(i);
        }

        // 遍历数组(获取数组内容) 用for循环
        var arr = ["曲奇", "111", "222", "333"]
        for (var i = 0; i < arr.length; i++) {
            console.log(arr[i]);
        }
        // 拿取对象中的数据 要用for-in遍历 不能用for循环
        var obj = {
            name:"曲奇",
            age:18,
            aex:"女",
        }
        for (var key in obj) {
            console.log(key);
            console.log(obj[key]);
        }
        // for-in 也可以遍历数组

        // while循环
        // 语法: while (condition) {条件满足执行的代码}
        // 注意: 循环体内要有改变循环条件的代码 以免陷入死循环
        var count = 0;
        while (count < 5) {
            console.log(`循环执行次数${count}`);
            count ++;
        }
        console.log("循环体外面部分");

        // do...while循环
        // 语法: do {代码体} while (condition);
        // do...while与while不同点: do...while一定会执行一次代码体
        var a = 8;
        do {
            console.log("循环执行");
            a ++;
        } while (a < 4);
        
      </script>
</body>
</html>
